name: build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Locate project
        run: |
          if [ -f Makefile ]; then echo "PROJ=." >> "$GITHUB_ENV"
          elif ls *.zip >/dev/null 2>&1; then
            unzip -q -o "$(ls *.zip | head -1)" -d src_unzipped
            dir=$(dirname "$(find src_unzipped -name Makefile | head -1)")
            echo "PROJ=$dir" >> "$GITHUB_ENV"
          else echo "no project found"; exit 1; fi
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-arm-linux-gnueabihf binutils-arm-linux-gnueabihf file zip
          pip install --quiet pillow
      - name: Test
        working-directory: ${{ env.PROJ }}
        run: |
          make test
          make abi32
      - name: Build ARM package
        working-directory: ${{ env.PROJ }}
        run: |
          chmod +x scripts/*.sh mpc/*.sh
          READELF=arm-linux-gnueabihf-readelf ./scripts/package.sh
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DJ Scratch (build ${{ github.run_number }})
          make_latest: true
          files: |
            ${{ env.PROJ }}/dist/DJScratch-1.1.0-mpc-armv7.zip
            ${{ env.PROJ }}/dist/setup.sh
